plugins {
    alias(libs.plugins.android.application)
}

android {

    namespace = 'com.xmission.trevin.android.notes'

    /**
     * compileSdkVersion specifies the Android API level Gradle should
     * use to compile your app. This means your app can use the API
     * features included in this API level and lower.
     */

    compileSdk = 37

    buildToolsVersion = "37.0.0"

    /**
     * The defaultConfig block encapsulates default settings and entries
     * for all build variants and can override some attributes in
     * main/AndroidManifest.xml dynamically from the build system.
     * You can configure product flavors to override these values for
     * different versions of your app.
     */

    defaultConfig {

        // Uniquely identifies the package for publishing.
        applicationId = "com.xmission.trevin.android.notes"

        // Defines the minimum API level required to run the app.
        // Current minimum is Lollipop (Android 5.0)
        minSdk = 21

        // Specifies the API level used to test the app.
        // Current target is Cinnamon Bun (Android 17)
        targetSdk = 37

        // Defines the version number of your app.
        versionCode = 1070301

        // Defines a user-friendly version name for your app.
        versionName = "1.7.3"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        // "Desugaring" the Java API allows using the
        // java.time package on old devices, e.g. API < 26.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled = false
            testCoverageEnabled = true
            enableAndroidTestCoverage = true
            enableUnitTestCoverage = true
            shrinkResources = false
        }
        release {
            // Minifying entails removing unused code and resources,
            // obfuscating class names, and rewriting code.
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            shrinkResources = true
        }
    }

    aaptOptions {
        // This may be needed to work around a reproducibility issue
        // where PNG optimization does not provide deterministic output.
        cruncherEnabled = false
    }

    lintOptions {
        // This is needed because linting shows two false
        // positives on "calling new methods on older versions"
        // where the code does check for the correct SDK level.
        abortOnError = false

        disable 'MissingDefaultResource'

        // Workaround for issues with Android Studio
        // complaining about not targeting the latest SDK
        disable 'ExpiredTargetSdkVersion'

        // Ignore warnings about buttons not being borderless;
        // we simply use the AppCompat theme and don't have any
        // style overrides for buttons anyway.
        disable 'ButtonStyle'
    }

    // This is for UI tests that require the ContentResolver
    useLibrary 'android.test.mock'

}

dependencies {
    // DO NOT UPGRADE THIS!  Version 2.1.5 has a bug resulting in
    // NoClassDefFoundError: j$.util.DesugarCollections
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'androidx.core:core:1.16.0'
    //implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    // The Loader library requires refactoring the entire app
    // to use Fragments instead of Activities!
    // implementation 'androidx.loader:loader:1.1.0'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation 'androidx.work:work-testing:2.11.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.apache.commons:commons-lang3:3.20.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'commons-io:commons-io:2.21.0'
    testImplementation 'org.apache.commons:commons-lang3:3.20.0'
    // Android includes a JSON implementation, but that
    // isn't available outside of the Android system so we
    // have to provide our own for stand-alone unit tests.
    testImplementation 'org.json:json:20251224'
}
